# Creation rules for the DSH harness credential documents.
#
# There is one document per profile, and the profile names the file:
#
#   secrets.web.sops.yaml   used by `profiles/web`
#   secrets.work.sops.yaml   used by `profiles/work`
#
# Both are ciphertext committed to the repo. Nothing selects between them at
# runtime by guessing: each profile patch names its own file, so running
# `dsh work` on the home machine still reads the work document.
#
# A file that already exists carries its own recipients in its `sops:` metadata,
# so these rules only decide who a *new* file is encrypted to. The key below is
# this machine's; a document created somewhere else should be seeded with that
# machine's key instead:
#
#   sops --encrypt --age "$(age-keygen -y ~/.config/sops/age/keys.txt)" ...
#
# The rule matches both names so that `sops secrets.work.sops.yaml` applies the
# right recipients here, and so re-keying with
#   sops updatekeys secrets.web.sops.yaml
# works without repeating the age1… key in each project.
creation_rules:
  - path_regex: secrets\.(web|work)\.sops\.ya?ml$
    key_groups:
      - age:
          - age14yat0hyq3w0ahkzetdw9t9q28x2pe3x4e27qs2kw9e968frdec3sx0ntr7
