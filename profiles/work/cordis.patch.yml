# The work profile. Everything it shares with `web` comes from the
# `dsh-config-core` bundle; the only thing here is the model list, which is what
# the profile exists to decide.
#
# Credentials are *not* per profile: they are machine-scoped. This profile reads
# whichever credential document is mounted in `$DSH_HOME` — the tracked
# `secrets.sops.yaml`, or a gitignored `secrets.local.sops.yaml` when the
# machine does not hold the tracked document's age identity. See README,
# "Using this repo somewhere else".
#
# The GitLab MCP row is also machine-scoped: it lives in the untracked home
# layer, so it points at whichever GitLab the machine can reach.

# Scaffold: these are the same ids `web` uses. Replace them with the models
# reachable from work (an internal gateway would add its own provider below,
# restating the whole `llm-pi-ai` config because a patch replaces it). The key
# still comes from the credential document as OPENROUTER_API_KEY.
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        models:
          - id: z-ai/glm-5.3-flash
          - id: z-ai/glm-5.3
          - id: moonshotai/kimi-k3
