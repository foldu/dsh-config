# This profile's own patch layer, applied after every bundle layer: a top-level
# YAML array of loader patch entries (id-targeted config overrides, disables,
# and insert lists; `!!js` expressions allowed).
#
# Almost nothing is here on purpose. The shared rows live in the
# `dsh-config-core` bundle (search provider, credentials document, GitHub and
# REA MCP servers, sandbox roots, co-author table, theme), so the `work` profile
# gets them without copying anything. What remains is the one thing this profile
# exists to decide: the model list.
#
# The GitLab MCP row is neither here nor in the shared bundle: its endpoint is a
# host on the home network, so it lives in the untracked home layer
# (`$DSH_HOME/cordis.patch.yml`), which applies to every profile on this
# machine. See README, "Machine-local overlay".

# OpenRouter through the pi-ai adapter (already mounted as `llm-pi-ai`, dormant
# without routes). The catalog carries ~390 models across two protocols; `models`
# replaces it wholesale, so this is the filter — each entry needs only its id and
# inherits context window, output cap, image support and reasoning levels from
# the installed catalog. Add or drop ids to taste; `:batch` variants are async
# batch endpoints and belong nowhere near an interactive agent. The key comes
# from the credential document as OPENROUTER_API_KEY.
#
# The provider entries are restated because a patch replaces the row's whole
# config — a profile that wants a different provider must repeat the shape.
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        models:
          - id: z-ai/glm-5.3-flash
          - id: z-ai/glm-5.3
          - id: moonshotai/kimi-k3
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
