# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# Kagi search provider (dsh-web-search-kagi), installed from the local
# checkout at plugins/dsh-web-search-kagi (repo-local).
- insert:
    - id: web-search-kagi
      name: "dsh-web-search-kagi"

# Pin the web seam's search to Kagi. A patch replaces the row's whole config,
# so fetchProvider is restated to keep web_fetch on the shipped HTTP backend.
- id: web
  config:
    searchProvider: kagi
    fetchProvider: http

# Stop mounting the shipped DeepSeek provider so the two never compete.
- id: web-search-deepseek
  disabled: true

# Credential references and records from SOPS (dsh-sops-credentials, plugins/).
#
# secrets.sops.yaml is the only credential document: references at the top
# level, durable records under `records:`. It is decrypted into memory once at
# startup and re-decrypted when the file changes, so no plaintext copy exists —
# no .env, no .credentials.yaml. A `set` on a SOPS-backed reference is refused
# rather than silently shadowed; edit the document (sops secrets.sops.yaml).
#
# The plaintext store underneath is still mounted because the harness writes
# records at runtime (a sign-in) that the read-only document cannot accept;
# promote those with bin/secrets-sync.sh, which also deletes the plaintext file.
- id: credentials
  disabled: true
- insert:
    - id: credentials-sops
      name: "dsh-sops-credentials"
      config:
        sopsFile: !!js dshHomePath('secrets.sops.yaml')
        ageKeyFile: !!js dshHomePath('..', '.config', 'sops', 'age', 'keys.txt')

# OpenRouter through the pi-ai adapter (already mounted as `llm-pi-ai`, dormant
# without routes). The catalog carries ~390 models across two protocols; `models`
# replaces it wholesale, so this is the filter — each entry needs only its id and
# inherits context window, output cap, image support and reasoning levels from
# the installed catalog. Add or drop ids to taste; `:batch` variants are async
# batch endpoints and belong nowhere near an interactive agent. The key comes
# from secrets.sops.yaml as OPENROUTER_API_KEY.
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        models:
          - id: z-ai/glm-5.3-flash
          - id: z-ai/glm-5.3
          - id: moonshotai/kimi-k3

# GitHub's official MCP server through a stdio bridge. bin/sops-run.mjs decrypts
# secrets.sops.yaml into mcp-remote's environment only, and mcp-remote expands
# ${GITHUB_TOKEN} into the header it sends; the token never enters the harness
# process, this file, or any plaintext file. dsh-mcp-client maps the server's
# tools to mcp__github__<tool>.
- insert:
    - id: mcp-github
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: github
        transport: stdio
        command: node
        args:
          - !!js dshHomePath('bin', 'sops-run.mjs')
          - !!js dshHomePath('secrets.sops.yaml')
          # Only GITHUB_TOKEN reaches the child; the rest of the document
          # stays in the harness process.
          - "--only"
          - "GITHUB_TOKEN"
          - npx
          - "-y"
          - mcp-remote
          - "https://api.githubcopilot.com/mcp/"
          - "--header"
          - "Authorization: Bearer ${GITHUB_TOKEN}"
          # Read-only toolset; drop this header for write access.
          - "--header"
          - "X-MCP-Readonly: true"
        env:
          npm_config_cache: !!js dshHomePath('..', '.cache', 'npm')
          MCP_REMOTE_CONFIG_DIR: !!js dshHomePath('..', '.cache', 'mcp-auth')
        # Deliberately NOT failOnStartupError: an MCP server that cannot reach
        # the network must leave the harness up and tool-less, not crash-loop
        # the whole GUI. The client retries in the background.

# Extra sandbox writable roots (dsh-extra-writable-roots). This list lives in
# the profile patch rather than the bundle's own patch because HMR watches this
# file: an edit here applies to the next confined call, while editing a bundle
# layer only changes what a fresh composition reads. Each entry must exist and
# be a directory, unless `createMissingRoots` is set; declaring /tmp also
# replaces the runner's private per-call tmpfs with the host directory, so temp
# files persist across calls.
#
# The pnpm entries exist so an in-sandbox `pnpm install`/`pnpm add` (and npx)
# works: pnpm keeps its content-addressable store outside every workspace, its
# last-update state under the XDG state dir, npx caches under ~/.npm, and its
# store-operation lock files under the per-login runtime dir. `$XDG_RUNTIME_DIR`
# is expanded by the plugin, and `createMissingRoots` creates the lock
# directory, which pnpm itself creates lazily — the first store operation can
# happen after this row mounts, and failing the mount would take both sandbox
# halves down with it.
- id: extra-writable-roots
  config:
    writablePaths:
      - "~/.cache"
      - "~/.cargo"
      - /tmp
      # pnpm store lock files (uid 1000's per-login runtime directory).
      - "$XDG_RUNTIME_DIR/pnpm-store-operation-locks-1000"
      # pnpm's content-addressable store.
      - "~/.local/share/pnpm"
      # pnpm-state.json (the update-notifier state).
      - "~/.local/state/pnpm"
      # npx/npm cache, which `npx mcp-remote` writes.
      - "~/.npm"
    applyInReadOnly: false
    createMissingRoots: true

# Watch the local plugin sources, so saving a plugin file (or a `pnpm build`)
# reloads that plugin in place instead of needing a harness restart. `root` is
# resolved against the profile directory and HMR ignores `**/node_modules`, so
# this names the real `$DSH_HOME/plugins` tree rather than the profile's
# symlinks into it. Only `config` is restated: the shipped row's `disabled`
# condition (a launched profile) stays as the base bundle set it.
#
# A reload re-imports the changed module graph and re-registers the plugin with
# the config it already had, so plugin instance state is not preserved. For a
# plugin that provides services (as dsh-extra-writable-roots does) a call that
# lands inside the swap can fail; HMR rolls back to the previous generation if
# the replacement cannot be imported or activated.
#
# Do not trigger a reload from inside a long-lived confined call: a call still
# running when the reload starts becomes its in-flight consumer and stalls or is
# aborted while teardown settles. Edit, let the call return, verify separately.
- id: hmr
  config:
    root:
      - "../../plugins"
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false

# GitLab MCP is NOT here on purpose: its endpoint is a host on the home network,
# so that row lives in the untracked home layer (`$DSH_HOME/cordis.patch.yml`),
# which is applied after this file. See README, "Machine-local overlay".

# REA — Reverse Engineer Anything (morluto/rea): a local stdio MCP server for
# native binaries, JavaScript/Electron apps, .NET assemblies and websites.
# Static analysis needs nothing extra; decompilation drives an already-installed
# Hopper, Ghidra, or IDA, and the Android/firmware paths use their own tools.
# Pinned to 6.5.0 so a boot cannot silently swap the tool catalogue — bump it
# deliberately. First launch downloads the package into ~/.cache/npm, a declared
# writable root.
- insert:
    - id: mcp-rea
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: rea
        transport: stdio
        command: npx
        args:
          - "-y"
          - "rea-agents@6.5.0"
          - "mcp"
        # Ghidra and its JDK come from the Nix install. bin/ghidra-home.mjs
        # resolves both store paths at mount, because the profile's `ghidra`
        # launcher is an extension layer whose real install is a sibling store
        # path. A missing Ghidra yields no variables (REA reports it
        # unconfigured) rather than failing the row.
        env: !!js >-
          Object.fromEntries([
            ["npm_config_cache", dshHomePath('..', '.cache', 'npm')],
            ...process.getBuiltinModule('node:child_process')
              .execFileSync(process.execPath, [dshHomePath('bin', 'ghidra-home.mjs')], { encoding: "utf8" })
              .split("\n")
              .filter(Boolean)
              .map((line) => line.split("=")),
          ])
        # Analyses run for minutes (decompilation, tracing), so the default
        # 60s tool-call bound would abort them mid-flight.
        toolCallTimeoutMs: 600000
        # Non-fatal like the other rows: a failed first download or a missing
        # decompiler costs the REA tools, never the GUI.
        reconnect:
          enabled: true
          maxAttempts: 5
          initialDelayMs: 1000
          maxDelayMs: 30000

# Co-author identity (dsh-coauthor-identity, plugins/). The composer's model
# picker is the source of truth: the plugin reads the Agent's live
# provider/model at each prompt assembly, tells the model who it is running as,
# and supplies the exact `Co-authored-by:` trailer to append to a git commit.
# Keys are the exact `provider/model` pair the picker stores; a bare model id
# matches any provider, and `*` is the last resort. An unlisted selection
# contributes no text, so a newly added model is never credited as the wrong
# vendor — add its pair here. Addresses are deployment choices: the model
# catalog carries display names but no co-author addresses.
- id: coauthor-identity
  config:
    coAuthors:
      # Bare model ids match either official DeepSeek route
      # (deepseek-official for the API key, deepseek-account for sign-in).
      "deepseek-flash":
        name: DeepSeek-V4.1-Flash
        email: noreply@deepseek.com
      "deepseek-v4-pro":
        name: DeepSeek-V4-Pro
        email: noreply@deepseek.com
      "openrouter/z-ai/glm-5.3-flash":
        name: GLM-5.3-Flash
        email: noreply@z.ai
      "openrouter/z-ai/glm-5.3":
        name: GLM-5.3
        email: noreply@z.ai
      "openrouter/moonshotai/kimi-k3":
        name: Kimi K3
        email: noreply@moonshot.ai

- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
